name: Site landing checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate approved landing screenshots
        run: node --test scripts/check_landing.test.mjs
